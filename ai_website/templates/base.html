<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ryan Thompson{% endblock %}</title>
    
    <!-- Favicon. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23374151' d='M11.5 0c1.93 0 3.5 1.57 3.5 3.5V28.5c0 1.93-1.57 3.5-3.5 3.5c-1.81 0-3.29-1.37-3.48-3.13c-.32.09-.67.13-1.02.13c-2.21 0-4-1.79-4-4c0-.46.08-.91.23-1.33C1.34 22.96 0 21.14 0 19c0-1.99 1.17-3.72 2.86-4.52C2.32 13.8 2 13.17 2 12c0-1.92 1.35-3.52 3.15-3.91C5.05 7.74 5 7.37 5 7c0-1.87 1.29-3.44 3.02-3.88C8.33 1.37 9.69 0 11.5 0zM20.5 0c1.81 0 3.29 1.37 3.48 3.12c1.74.44 3.02 2.01 3.02 3.88c0 .37-.05.74-.15 1.09C28.65 8.48 30 10.08 30 12c0 .94-.32 1.8-.86 2.48C30.83 15.28 32 16.99 32 19c0 2.14-1.34 3.96-3.23 4.67c.14.41.23.86.23 1.33c0 2.21-1.79 4-4 4c-.35 0-.7-.04-1.02-.13C23.79 30.63 22.31 32 20.5 32c-1.93 0-3.5-1.57-3.5-3.5V3.5c0-1.93 1.57-3.5 3.5-3.5z'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23374151' d='M11.5 0c1.93 0 3.5 1.57 3.5 3.5V28.5c0 1.93-1.57 3.5-3.5 3.5c-1.81 0-3.29-1.37-3.48-3.13c-.32.09-.67.13-1.02.13c-2.21 0-4-1.79-4-4c0-.46.08-.91.23-1.33C1.34 22.96 0 21.14 0 19c0-1.99 1.17-3.72 2.86-4.52C2.32 13.8 2 13.17 2 12c0-1.92 1.35-3.52 3.15-3.91C5.05 7.74 5 7.37 5 7c0-1.87 1.29-3.44 3.02-3.88C8.33 1.37 9.69 0 11.5 0zM20.5 0c1.81 0 3.29 1.37 3.48 3.12c1.74.44 3.02 2.01 3.02 3.88c0 .37-.05.74-.15 1.09C28.65 8.48 30 10.08 30 12c0 .94-.32 1.8-.86 2.48C30.83 15.28 32 16.99 32 19c0 2.14-1.34 3.96-3.23 4.67c.14.41.23.86.23 1.33c0 2.21-1.79 4-4 4c-.35 0-.7-.04-1.02-.13C23.79 30.63 22.31 32 20.5 32c-1.93 0-3.5-1.57-3.5-3.5V3.5c0-1.93 1.57-3.5 3.5-3.5z'/></svg>">
    
    <script>
        try { var t = localStorage.getItem('site-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head_extra %}{% endblock %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/me.jpeg') }}" alt="" class="nav-logo-img">
                    <span class="nav-logo-name">Ryan <strong>Thompson</strong></span>
                </a>
            </div>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-controls="primary-navigation" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="nav-menu" id="primary-navigation">
                <a href="{{ url_for('home') }}" class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
                    <i class="fas fa-home" aria-hidden="true"></i> Home
                </a>
                <a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}active{% endif %}">
                    <i class="fas fa-info-circle" aria-hidden="true"></i> About
                </a>
                <a href="{{ url_for('cycling') }}" class="nav-link {% if request.endpoint == 'cycling' %}active{% endif %}">
                    <i class="fas fa-bicycle" aria-hidden="true"></i> Cycling
                </a>
                <a href="{{ url_for('projects') }}" class="nav-link {% if request.endpoint == 'projects' or 'demo' in request.endpoint %}active{% endif %}">
                    <i class="fas fa-flask" aria-hidden="true"></i> Demos
                </a>
                <a href="{{ url_for('learn') }}" class="nav-link {% if request.endpoint == 'learn' %}active{% endif %}">
                    <i class="fas fa-graduation-cap" aria-hidden="true"></i> Learn
                </a>
                <a href="{{ url_for('learn_electrician') }}" class="nav-link {% if request.endpoint == 'learn_electrician' %}active{% endif %}">
                    <i class="fas fa-bolt" aria-hidden="true"></i> Electrician
                </a>
                <div class="theme-switcher">
                    <button type="button" class="theme-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Choose theme">
                        <i class="fas fa-palette" aria-hidden="true"></i> Theme
                    </button>
                    <ul class="theme-menu" role="menu">
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="light"><span class="theme-swatch" style="background:#1f684d"></span>Light</button></li>
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="dark"><span class="theme-swatch" style="background:#171c19"></span>Dark</button></li>
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="midnight"><span class="theme-swatch" style="background:#4f6bed"></span>Midnight</button></li>
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="ocean"><span class="theme-swatch" style="background:#0b6e99"></span>Ocean</button></li>
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="sunset"><span class="theme-swatch" style="background:#e11d74"></span>Sunset</button></li>
                        <li><button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-value="contrast"><span class="theme-swatch" style="background:#ffe600"></span>High Contrast</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Ryan Thompson.</p>
            <div class="footer-links">
                <a href="https://github.com/rt75272" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="mailto:rt75272@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://www.linkedin.com/in/ryan42-p42-t42/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
